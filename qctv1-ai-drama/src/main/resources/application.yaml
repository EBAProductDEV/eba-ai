server:
  # 10083 已被 qctv1-iam 占用，短剧服务使用 10084，网关本地路由同步指向该端口。
  port: 10084
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true
  error:
    include-message: always
    include-binding-errors: always
    include-exception: true
    include-stacktrace: always
  tomcat:
    accesslog:
      enabled: true
      directory: logs
      prefix: drama-access
      suffix: .log
      pattern: '%h %l %u %t "%r" %s %b %D "%{Referer}i" "%{User-Agent}i"'

spring:
  application:
    name: qctv1-ai-drama
  profiles:
    # 当前沿用已有默认 nacos 策略；本地调试如果不走 Nacos，可启动时指定 --spring.profiles.active=local。
    default: nacos
  mvc:
    log-request-details: true
  datasource:
    url: jdbc:mysql://${QCTV1_DB_MYSQL_HOST:localhost}:${QCTV1_DB_MYSQL_PORT:3306}/qctv1-dev?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=utf8
    username: ${QCTV1_DB_MYSQL_USER:root}
    password: ${QCTV1_DB_MYSQL_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: localhost
      port: 6379
      password:
      database: 0

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,loggers
  endpoint:
    health:
      show-details: always

logging:
  level:
    root: INFO
    com.qctv1.ai.drama: INFO
    com.qctv1.ai.drama.mapper: INFO
    com.baomidou.mybatisplus: WARN
    org.mybatis: WARN
    org.apache.ibatis: WARN
    org.springframework.web: INFO
    org.springframework.web.servlet.DispatcherServlet: INFO
    org.springframework.jdbc: WARN
    org.springframework.jdbc.core: WARN
    org.springframework.transaction: WARN
    jdk.internal.httpclient.debug: OFF
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] %logger{80} - %msg%n"

app:
  ai:
    drama:
      # 固定使用中文素材根目录。接口读取时会校验路径必须留在该根目录内。
      asset-root: "D:/AI视频"
      # 剪映初稿免费素材库和每集导出包目录。
      material-root: ${DRAMA_MATERIAL_ROOT:D:/AI视频/剪辑素材文件夹}
      ffmpeg-path: ${DRAMA_FFMPEG_PATH:ffmpeg}
      ffprobe-path: ${DRAMA_FFPROBE_PATH:ffprobe}
      text:
        provider: openai-compatible
        base-url: ${DRAMA_TEXT_BASE_URL:https://apixg.squarefaceicon.org/v1}
        completions-path: ${DRAMA_TEXT_COMPLETIONS_PATH:/chat/completions}
        api-key: "sk-HMOoi37qdP9A1IYWFpMQoiCHP5v6u2Ka3sgXDjpcL2ttG1Hu"
        model: "gpt-5.4-mini"
      vision:
        provider: openai-compatible
        base-url: ${DRAMA_VISION_BASE_URL:${DRAMA_TEXT_BASE_URL:https://apixg.squarefaceicon.org/v1}}
        completions-path: ${DRAMA_VISION_COMPLETIONS_PATH:/chat/completions}
        api-key: "sk-HMOoi37qdP9A1IYWFpMQoiCHP5v6u2Ka3sgXDjpcL2ttG1Hu"
        model: ${DRAMA_VISION_MODEL:gpt-5.4-mini}
        rough-model: ${DRAMA_VISION_ROUGH_MODEL:gpt-5.4-nano}
        analysis-model: ${DRAMA_VISION_ANALYSIS_MODEL:gpt-5.4-mini}
        review-model: ${DRAMA_VISION_REVIEW_MODEL:gpt-5.5}
        max-frames-per-shot: ${DRAMA_VISION_MAX_FRAMES_PER_SHOT:3}
      image:
        provider: openai-compatible
#       https://api-direct.bbww.top、https://api.bbww.top/v1
        base-url: ${DRAMA_IMAGE_BASE_URL:https://api-direct.bbww.top/v1}
        images-path: ${DRAMA_IMAGE_IMAGES_PATH:/images/generations}
        image-edits-path: ${DRAMA_IMAGE_EDITS_PATH:/images/edits}
        api-key: ${DRAMA_IMAGE_API_KEY:sk-U3AGwOTIPe8mrEb7fKaMDJUlDbgLEfTzDEltJVwU6YcfHbCp}
        model: ${DRAMA_IMAGE_MODEL:gpt-image-2-c}
        image-size: ${DRAMA_IMAGE_SIZE:1024x1536}
        image-quality: ${DRAMA_IMAGE_QUALITY:low}
        image-output-format: ${DRAMA_IMAGE_OUTPUT_FORMAT:jpeg}
        image-output-compression: ${DRAMA_IMAGE_OUTPUT_COMPRESSION:85}
        image-stream: ${DRAMA_IMAGE_STREAM:true}
        image-partial-images: ${DRAMA_IMAGE_PARTIAL_IMAGES:1}
      video:
        provider: openai-compatible
        base-url: ${DRAMA_VIDEO_BASE_URL:https://api.bbww.top/v1}
        videos-path: ${DRAMA_VIDEO_VIDEOS_PATH:/videos}
        api-key: ${DRAMA_VIDEO_API_KEY:sk-NKm964SAyVR5UVrNBrI80G8aM6UvC55cXqVUp5RmORdU3zvG}
        model: ${DRAMA_VIDEO_MODEL:doubao-seedance-1-5-pro-251215}
      embedding:
        provider: openai-compatible
        base-url: ${DRAMA_EMBEDDING_BASE_URL:}
        api-key: ${DRAMA_EMBEDDING_API_KEY:}
        model: ${DRAMA_EMBEDDING_MODEL:}
      vector-store:
        type: redis-stack
        index-name: qctv1_ai_drama_chunk_idx
        key-prefix: "qctv1:ai:drama:chunk:"
        embedding-dimension: 1536
        distance-metric: COSINE

mybatis-plus:
  global-config:
    db-config:
      id-type: auto
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl
